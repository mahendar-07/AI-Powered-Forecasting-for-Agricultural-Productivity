<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Crop Recommendation System</title>

```
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, Helvetica, sans-serif;
    }

    body{
        background:linear-gradient(135deg,#4CAF50,#81C784);
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:20px;
    }

    .container{
        background:white;
        width:100%;
        max-width:600px;
        padding:30px;
        border-radius:15px;
        box-shadow:0 8px 20px rgba(0,0,0,0.2);
    }

    h1{
        text-align:center;
        color:#2e7d32;
        margin-bottom:25px;
    }

    .form-group{
        margin-bottom:15px;
    }

    label{
        display:block;
        margin-bottom:6px;
        font-weight:bold;
        color:#333;
    }

    input{
        width:100%;
        padding:12px;
        border:1px solid #ccc;
        border-radius:8px;
        font-size:15px;
    }

    input:focus{
        outline:none;
        border-color:#4CAF50;
    }

    button{
        width:100%;
        padding:14px;
        background:#4CAF50;
        color:white;
        border:none;
        border-radius:8px;
        font-size:16px;
        cursor:pointer;
        margin-top:10px;
    }

    button:hover{
        background:#388E3C;
    }

    .info{
        margin-top:20px;
        background:#f5f5f5;
        padding:15px;
        border-radius:8px;
        font-size:14px;
        color:#555;
    }

    .info h3{
        margin-bottom:10px;
        color:#2e7d32;
    }
</style>
```

</head>

<body>

<div class="container">

```
<h1>🌱 AI Crop Recommendation System</h1>

<form action="/predict" method="POST">

    <div class="form-group">
        <label>Nitrogen (N)</label>
        <input type="number" name="N" min="0" max="140"
               placeholder="Enter value between 0 - 140" required>
    </div>

    <div class="form-group">
        <label>Phosphorous (P)</label>
        <input type="number" name="P" min="5" max="145"
               placeholder="Enter value between 5 - 145" required>
    </div>

    <div class="form-group">
        <label>Potassium (K)</label>
        <input type="number" name="K" min="5" max="205"
               placeholder="Enter value between 5 - 205" required>
    </div>

    <div class="form-group">
        <label>Temperature (°C)</label>
        <input type="number" step="0.01" name="temperature"
               min="8" max="44"
               placeholder="Enter value between 8 - 44" required>
    </div>

    <div class="form-group">
        <label>Humidity (%)</label>
        <input type="number" step="0.01" name="humidity"
               min="14" max="100"
               placeholder="Enter value between 14 - 100" required>
    </div>

    <div class="form-group">
        <label>pH Value</label>
        <input type="number" step="0.01" name="ph"
               min="3.5" max="10"
               placeholder="Enter value between 3.5 - 10" required>
    </div>

    <div class="form-group">
        <label>Rainfall (mm)</label>
        <input type="number" step="0.01" name="rainfall"
               min="20" max="300"
               placeholder="Enter value between 20 - 300" required>
    </div>

    <button type="submit">
        Predict Recommended Crop
    </button>

</form>

<div class="info">
    <h3>Input Guidelines</h3>
    <p>Nitrogen: 0-140</p>
    <p>Phosphorous: 5-145</p>
    <p>Potassium: 5-205</p>
    <p>Temperature: 8-44 °C</p>
    <p>Humidity: 14-100 %</p>
    <p>pH: 3.5-10</p>
    <p>Rainfall: 20-300 mm</p>
</div>
```

</body>
