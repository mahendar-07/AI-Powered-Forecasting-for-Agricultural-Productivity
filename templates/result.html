<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>

    <style>

        body{
            font-family:Arial, sans-serif;
            background:#f4f4f4;
        }

        .container{
            width:500px;
            margin:100px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            text-align:center;
            box-shadow:0px 0px 10px rgba(0,0,0,0.2);
        }

        h1{
            color:#2c3e50;
        }

        .crop{
            color:#27ae60;
            font-size:32px;
            font-weight:bold;
            margin-top:20px;
        }

        a{
            display:inline-block;
            margin-top:20px;
            padding:10px 20px;
            background:#3498db;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }

        a:hover{
            background:#2980b9;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🌾 Recommended Crop</h1>

    <div class="crop">
        {{ prediction }}
    </div>

    <a href="/">
        Predict Again
    </a>

</div>

</body>
</html>
